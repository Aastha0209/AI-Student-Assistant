<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Tasks</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>AI Assistant</h2>

    <ul>

      <li>
        <a href="dashboard.html">
          Dashboard
        </a>
      </li>

      <li>
        <a href="attendance.html">
          Attendance
        </a>
      </li>

      <li>
        <a href="notes.html">
          Notes
        </a>
      </li>

      <li>
        <a href="tasks.html"
        class="active-link">

          Tasks

        </a>
      </li>

      <li>
        <a href="timetable.html">
          Timetable
        </a>
      </li>

      <li>
        <a href="profile.html">
          Profile
        </a>
      </li>

      <li>

        <button id="logout-btn">

          Logout

        </button>

      </li>

    </ul>

  </div>



  <!-- MAIN CONTENT -->
  <div class="main-content">


    <!-- TOPBAR -->
    <div class="topbar">

      <h1>

        Task Manager

      </h1>

    </div>



    <!-- CARDS -->
    <div class="cards">


      <!-- TOTAL TASKS -->
      <div class="dashboard-card">

        <h3>

          Total Tasks

        </h3>

        <p id="task-count">

          0

        </p>

      </div>



      <!-- COMPLETED -->
      <div class="dashboard-card">

        <h3>

          Completed

        </h3>

        <p id="completed-count">

          0

        </p>

      </div>



      <!-- PENDING -->
      <div class="dashboard-card">

        <h3>

          Pending

        </h3>

        <p id="pending-count">

          0

        </p>

      </div>

    </div>



    <!-- TASK SECTION -->
    <div class="task-section">

      <h2>

        Manage Tasks

      </h2>


      <form id="task-form">

        <input
          type="text"
          id="task-input"
          placeholder="Enter Task"
          required
        >


        <button type="submit">

          Add Task

        </button>

      </form>



      <!-- TASK LIST -->
      <ul id="task-list"></ul>

    </div>

  </div>

</div>



<!-- TASK SCRIPT -->
<script type="module"
src="js/tasks.js"></script>


<!-- LOGOUT -->
<script type="module"
src="js/logout.js"></script>

</body>
</html>
